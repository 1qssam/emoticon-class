<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이모티콘 기획 · 원큐쌤의 이모티콘 클래스</title>
<meta name="description" content="하고 싶은 말부터 캐릭터 외형까지, 한 단계씩 적으면서 이모티콘 기획시트를 채워 가는 페이지입니다.">
<link rel="icon" type="image/png" sizes="32x32" href="https://1qssam.github.io/emoticon-rank/1qssam-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="make/make.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>이모티콘 기획</h1>
    <span class="brand">원큐쌤의 이모티콘 클래스</span>
    <span class="privacy" id="privacy"></span>
    <span class="by">만든 사람 <a href="https://litt.ly/1qssam" target="_blank" rel="noopener">원큐쌤(@1qssam)</a></span>
  </header>

  <div class="app">
    <!-- 왼쪽: 단계 목록 -->
    <nav class="box nav" id="nav" aria-label="단계"></nav>

    <!-- 가운데: 지금 단계의 질문 -->
    <main class="box main" id="main"><div class="card" id="card"></div></main>

    <!-- 오른쪽: 기획시트 -->
    <aside class="box side" aria-label="기획시트">
      <div class="bh"><h2>기획시트</h2></div>
      <div class="sheet-wrap" id="sheetWrap"><canvas id="sheetCv" aria-label="기획시트 미리보기"></canvas></div>
      <div class="tools">
        <button class="btn" id="getImg">이미지로 받기</button>
        <button class="btn" id="print">인쇄 / PDF</button>
        <button class="btn wide" id="popup">새 창으로 띄우기</button>
      </div>
      <div class="files">
        <button class="btn" id="saveFile" title="다른 컴퓨터에서 이어 하려면 이 파일을 받아 두세요">작업 저장</button>
        <button class="btn" id="loadBtn">불러오기</button>
        <button class="btn" id="reset">처음부터</button>
        <input type="file" id="loadFile" accept=".json,application/json" hidden>
      </div>
    </aside>
  </div>
</div>

<!-- 인쇄할 때만 보이는 곳 -->
<div id="printArea"><img id="printImg" alt="기획시트"></div>

<script src="make/config.js"></script>
<script src="make/keywords.js"></script>
<script src="make/core.js"></script>
<script src="make/shop.js"></script>
<script src="make/sheet.js"></script>
<script src="make/compose.js"></script>
<script src="make/plan.js"></script>
<script src="make/psd.js"></script>
<script src="make/psdkit.js"></script>
<script src="make/text.js"></script>
<script src="make/export.js"></script>
<script src="make/steps.js"></script>
</body>
</html>
